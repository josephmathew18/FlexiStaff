server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flexistaff-backend

  # Database configuration (using in-memory H2 database foundation so JPA initializes cleanly without PostgreSQL requirement)
  datasource:
    url: jdbc:h2:mem:flexistaffdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-milliseconds: 86400000 # 24 Hours
    refresh-expiration-milliseconds: 604800000 # 7 Days

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
