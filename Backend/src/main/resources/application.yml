    name: flexistaff-backend

  # PostgreSQL Database Configuration (Supabase, Render PostgreSQL, Local PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-2.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.wrlpzqqxwsihupmeeios}
    password: ${DB_PASSWORD:josephthekkel2255}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
